name: timezone_finder
description: >-
  Offline IANA time zone lookup for any coordinate on land, returning a
  package:timezone Location — so you can build correct local dates and times
  for many places at once.
version: 0.1.0
repository: https://github.com/pm-gwatch/timezone_finder
issue_tracker: https://github.com/pm-gwatch/timezone_finder/issues

topics:
  - timezone
  - geospatial
  - iana

# `lib/data/` is ~42 MB of base64. Over that much random-looking text, byte
# sequences matching credential patterns turn up by chance — pub's scanner
# flagged three as AWS access keys, all of them fragments of packed polygon
# coordinates.
#
# Narrow to the generated data only, never the whole package. Nothing
# hand-written lands here: every file is produced by tool/refresh.dart from a
# public boundary release, and the suite checks the bundled bytes against a
# rebuild, so a real secret has no route in.
false_secrets:
  - /lib/data/**

environment:
  # Floor is set by timezone 0.11.1, which requires ^3.10.0. Before that
  # dependency the floor was ^3.8.0, set by lints ^6.1.0. The lookup itself
  # still needs nothing beyond Dart 3.0.
  sdk: ^3.10.0

# timezone supplies the offset engine: transition tables, DST rules and the
# civil-time arithmetic this package deliberately does not reimplement. The
# lookup itself still uses only dart:convert, dart:typed_data and dart:math.
#
# Note that we depend on the engine, never on a tzdata variant: the caller
# chooses and initializes `package:timezone/data/...` themselves, so this
# package never forces that payload on anyone.
dependencies:
  # Deliberately unbounded. Note that `pub publish` rejects this rather than
  # merely warning — it exits 65 — so the publish-dry-run CI job fails while
  # this stays as it is.
  timezone: any

dev_dependencies:
  lints: ^6.1.0
  # 1.31.1 is the newest release satisfiable across the whole supported SDK
  # range: it needs ^3.10.0, matching the floor above, while 1.31.2 needs
  # ^3.11.0. A current toolchain still resolves to 1.31.2, since pub picks dev
  # dependencies against the installed SDK rather than the floor.
  test: ^1.31.1
  # tool/ only — never imported from lib/.
  archive: ^4.0.0
  http: ^1.6.0
