name: timezone_finder
description: >-
  Makes package:timezone easier to use — turn a place on Earth into the
  Location it sits in, convert a TZDateTime from one Location to another, and
  read English metazone labels.
version: 0.1.0
repository: https://github.com/pm-gwatch/timezone_finder
issue_tracker: https://github.com/pm-gwatch/timezone_finder/issues

topics:
  - timezone
  - geospatial
  - iana

# Generated data can trip pub's secret scanner; not real credentials.
false_secrets:
  - /lib/src/data/**

environment:
  sdk: ^3.10.0

dependencies:
  timezone: ">=0.11.1 <1.0.0"
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
  archive: ^4.0.0
  http: ^1.6.0
