name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the floor from pubspec.yaml as well as stable: development
        # happens on a much newer SDK, so this is the only check that the
        # declared floor actually works.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart format --output=none --set-exit-if-changed .
      # Tests needing the 170 MB source GeoJSON skip themselves when it is
      # absent, so CI runs without the download. The full oracle comparison is
      # the maintainer's job before a data refresh lands.
      - run: dart test

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
