name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the floor from pubspec.yaml as well as stable: development
        # happens on a much newer SDK, so this is the only check that the
        # declared floor actually works.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The example server is its own package; without its own pub get the
      # analyzer reports its shelf_router import as unresolvable.
      - run: dart pub get --directory example/server
      - run: dart analyze --fatal-infos
      # Formatter output drifts across SDK versions (3.10 vs 3.13). Check it
      # once, on the declared floor, so the two matrix cells cannot disagree.
      - if: matrix.sdk == '3.10.0'
        run: dart format --output=none --set-exit-if-changed .
      # Tests needing the 170 MB source GeoJSON skip themselves when it is
      # absent, so CI runs without the download. The full oracle comparison is
      # the maintainer's job before a data refresh lands.
      - run: dart test

  # dart2js integer / bit paths that the VM cannot regress-test (zigzag, etc.).
  # browser_parity needs Chrome + the shipped .bin over packages/; varint and
  # quantization need no network assets. encoding_test stays VM-only (dart:io +
  # GeoJSON cache).
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          install-dependencies: true
      # Ubuntu 24.04 runners restrict unprivileged user namespaces via
      # AppArmor, which kills Chrome's sandboxed zygote on startup
      # ("No usable sandbox!", SIGABRT). Re-allow them; preferable to
      # passing --no-sandbox through dart_test.yaml, which would also
      # apply locally.
      - name: Allow Chrome's sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: dart pub get
      - name: Chrome integer / bit suites
        run: dart test -p chrome test/varint_test.dart test/quantization_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
      - name: Chrome boundary parity and install contract
        run: dart test -p chrome test/browser_parity_test.dart test/browser_preinstall_test.dart
        env:
          CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
